# cargo audit against the RustSec advisory database. Scheduled as well as on push, because an
# advisory can land against a dependency that has not changed.
name: audit

on:
  push:
    paths: ["Cargo.lock", "Cargo.toml", ".github/workflows/audit.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # A prebuilt binary; `cargo install cargo-audit` compiles for minutes.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
