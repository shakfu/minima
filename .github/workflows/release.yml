# On a version tag, build release binaries and publish them as a GitHub release.
# Linux binaries are static musl. Native runners per target: cross-compiling aws-lc-sys needs a
# cross C toolchain.
name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, platform: linux-aarch64 }
          - { runner: macos-15, target: aarch64-apple-darwin, platform: macos-aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      NAME: minima-${{ github.ref_name }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake
      - run: cargo build --release --locked --target "$TARGET"
      # x86_64 musl links static-pie, which `file` names "static-pie linked".
      - name: Check the binary is static
        if: runner.os == 'Linux'
        run: file "target/$TARGET/release/minima" | grep -Eq 'statically linked|static-pie linked'
      - name: Check the binary runs
        run: '"target/$TARGET/release/minima" --version'
      - name: Package
        run: |
          tar -czf "$NAME.tar.gz" -C "target/$TARGET/release" minima
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." minima-*
        env:
          GH_TOKEN: ${{ github.token }}
