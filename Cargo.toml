[package]
name = "minima"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A minimal coding agent for the terminal"
authors = ["Shakeeb Alireza"]
repository = "https://github.com/shakfu/minima"
homepage = "https://github.com/shakfu/minima"
readme = "README.md"
keywords = ["agent", "llm", "cli", "openai", "anthropic"]
categories = ["command-line-utilities", "development-tools"]
# No exclude: the README points at the mocks, the scripts and `make check`, so shipping the whole
# repo keeps the crates.io page honest. It costs a few KiB.

[[bin]]
name = "minima"
path = "src/main.rs"

[dependencies]
# Runtime. `select!` over the response stream and the key-event stream is the cancellation
# primitive; the rest of the feature list is incidental to that choice.
tokio = { version = "1.53", features = [
    "rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-std", "io-util", "signal",
] }
futures-util = "0.3"

# Transport. The `rustls` feature selects the aws-lc-rs provider, which builds `aws-lc-sys` from
# C and needs cmake on the build host. Swapping to ring costs `rustls-no-provider` plus a
# hand-built ClientConfig and the `webpki-roots` crate, roughly 15 lines; reqwest dropped its own
# `rustls-native-certs` and `webpki-roots` features after 0.13.1.
reqwest = { version = "0.13.5", default-features = false, features = [
    "json", "stream", "http2", "rustls",
] }
eventsource-stream = "0.2"

# Wire format and tool schemas. schemars derives the JSON Schema a tool advertises from the same
# struct serde deserializes its arguments into, so the two cannot drift.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Frontend. crossterm tracks reedline's requirement (0.49 -> ^0.29) because KeyEvent crosses that
# boundary and two versions of the type would not unify. Re-check on every reedline bump.
clap = { version = "4", features = ["derive", "env"] }
reedline = "0.49"
crossterm = "0.29"

# Diagnostics and errors.
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Integration tests cannot see the crate's regular dependencies.
[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic stays "unwind": the terminal guard restores cooked mode from Drop during unwind.
# panic = "abort" would leave the user's shell in raw mode after a crash.
