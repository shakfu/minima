[package]
name = "minima"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A minimal coding agent for the terminal"
authors = ["Shakeeb Alireza"]
repository = "https://github.com/shakfu/minima"
readme = "README.md"
keywords = ["agent", "llm", "cli", "openai", "anthropic"]
categories = ["command-line-utilities", "development-tools"]
# No exclude: the README points at the mocks, the scripts and `make check`, so shipping the whole
# repo keeps the crates.io page honest. It costs a few KiB.

[[bin]]
name = "minima"
path = "src/main.rs"

# The root package is the CLI; `minima-core` holds the providers and the agent loop, and builds
# off Unix. The root stays a package, so src/, tests/, mock/ and scripts/ keep their paths.
[workspace]
members = ["crates/minima-core"]

[dependencies]
# Both versions move together; publish minima-core first.
minima-core = { path = "crates/minima-core", version = "=0.7.0" }

# Runtime. `select!` over the response stream and the key-event stream is the cancellation
# primitive; the rest of the feature list is incidental to that choice.
tokio = { version = "1.53", features = [
    "rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-std", "io-util", "signal",
] }
futures-util = "0.3"

# Wire format and tool schemas. schemars derives the JSON Schema a tool advertises from the same
# struct serde deserializes its arguments into, so the two cannot drift.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Frontend. The REPL is an inline ratatui viewport: output goes to the terminal's scrollback and
# only the input box and status bar are redrawn. crossterm must match the version ratatui and
# ratatui-textarea select (`crossterm_0_29`), because KeyEvent crosses that boundary and two
# versions of the type would not unify.
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
ratatui-textarea = "0.9"
unicode-width = "0.2"
# Inline Markdown in REPL answers: emphasis, code spans, links. Parsing them to the CommonMark spec
# by hand is where a renderer goes wrong (`snake_case`, `\*`, a `*` inside a code span). Lines and
# fences stay minima's, because finished rows are already in the scrollback and cannot be redrawn.
# Without default features: no HTML writer, no CLI.
pulldown-cmark = { version = "0.13", default-features = false }

# Diagnostics and errors.
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The kernel policy under `--sandbox`, and the path check on `write` and `edit`. Pinned exactly:
# `cargo install` ignores Cargo.lock, and a 0.1.x release would otherwise change what `--sandbox`
# enforces in new installs without a minima release or CI run.
sanduk-sandbox = "=0.1.0"

# `killpg` for the bash tool's process group, and the `O_NONBLOCK` flag the file tools open with.
# Neither is in std. Already in the tree through tokio. minima is Unix-only; see `main.rs`.
libc = "0.2"

# Experiment only, off by default: the `js` tool and `MINIMA_CODEMODE`. See docs/dev/codemode.md.
rquickjs = { version = "=0.14.0", optional = true }

[features]
codemode = ["dep:rquickjs"]

[dev-dependencies]
minima-core = { path = "crates/minima-core", version = "=0.7.0", features = ["testing"] }
# Paused time, so tests of retry backoff do not sleep for real.
tokio = { version = "1.53", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic stays "unwind": the terminal guard restores cooked mode from Drop during unwind.
# panic = "abort" would leave the user's shell in raw mode after a crash.
